# Minimal OpenPLC configuration for PoC
# Assumes runtime v3-compatible Modbus/TCP mapping; adjust for OpenPLC v4 REST if used.

[general]
name = "CityLab-PoC-PLC"
logfile = "../../logs/openplc_runtime.log"

[network]
# Bind address for Modbus/TCP (0.0.0.0 to listen on all NICs inside Mininet host)
modbus_bind = "0.0.0.0"
modbus_port = 502

[mapping]
# Suggested mapping: coils starting at address 0
coils_start = 0
inputs_start = 0
holding_start = 0
